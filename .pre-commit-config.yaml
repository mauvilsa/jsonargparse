fail_fast: true
default_install_hook_types: [pre-commit, pre-push]

ci:
  skip:
  - twine-check
  - changelog-bump
  autofix_prs: true
  autoupdate_schedule: quarterly

repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-ast
  - id: check-case-conflict
  - id: check-docstring-first
  - id: end-of-file-fixer
  - id: mixed-line-ending
  - id: trailing-whitespace
    exclude: .bumpversion.cfg

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
  hooks:
  - id: ruff-check
  - id: ruff-format

- repo: https://github.com/crate-ci/typos
  rev: 9023c1f779400877cafdd98052113fc777e2cfdc  # frozen: v1.51.1
  hooks:
  - id: typos
    args: []
    verbose: true

- repo: https://github.com/pre-commit/mirrors-mypy
  rev: 2834ec6639549dd6796205c8f011dedcd587288b  # frozen: v2.4.0
  hooks:
  - id: mypy
    files: jsonargparse.*/.*.py
    stages: [pre-push]
    additional_dependencies:
      [
        types-PyYAML,
        types-requests,
      ]
    verbose: true

- repo: local
  hooks:

  - id: twine-check
    name: twine check [on bumpversion]
    entry: bash -c '
      set -e;
      if [ "${BUMPVERSION_NEW_VERSION+x}" = "" ]; then
        echo "$(tput setaf 6) Skipped, only runs when bumping version $(tput sgr0)";
      else
        python3 -m build --wheel;
        twine check dist/*.whl;
        cd jsonargparse_tests;
        python3 -m build --wheel;
        twine check dist/*.whl;
      fi'
    language: system
    pass_filenames: false
    verbose: true

  - id: changelog-bump
    name: changelog bump [on bumpversion]
    entry: bash -c '
      set -e;
      if [ "${BUMPVERSION_NEW_VERSION+x}" = "" ]; then
        echo "$(tput setaf 6) Skipped, only runs when bumping version $(tput sgr0)";
      else
        CHANGELOG=$(grep -E "^v.+\..+\..+ \(.*\)" CHANGELOG.rst | head -n 1);
        EXPECTED="v$BUMPVERSION_NEW_VERSION ($(date -u +%Y-%m-%d))";
        if [ "$CHANGELOG" != "$EXPECTED" ] && [ $(echo $BUMPVERSION_NEW_VERSION | grep -cE "[0-9.]+(\.dev|rc)[0-9]+") = 0 ]; then
          if [ $(grep -c "^v$BUMPVERSION_NEW_VERSION " CHANGELOG.rst) = 1 ]; then
            echo "Updating the date for v$BUMPVERSION_NEW_VERSION in CHANGELOG.rst";
            sed -i -e "s|^v$BUMPVERSION_NEW_VERSION .*|$EXPECTED|" CHANGELOG.rst;
            git add CHANGELOG.rst;
          else
            echo "Expected release in CHANGELOG.rst to be "$EXPECTED" or not have a definitive date.";
            exit 1;
          fi
        fi
      fi'
    language: system
    pass_filenames: false
    verbose: true

  - id: doctest
    name: sphinx-build -M doctest sphinx sphinx/_build sphinx/index.rst
    entry: bash -c '
      set -e;
      if [ "$(which sphinx-build)" = "" ]; then
        echo "$(tput setaf 6) Skipped, sphinx-build command not found $(tput sgr0)";
      else
        sphinx-build -M doctest sphinx sphinx/_build sphinx/index.rst;
      fi'
    stages: [pre-push]
    language: system
    pass_filenames: false
    verbose: true

  - id: tox
    name: tox --parallel --parallel-no-spinner with combined coverage
    entry: bash -c '
      set -e;
      rm -fr jsonargparse_tests/.coverage* jsonargparse_tests/htmlcov;
      tox --parallel --parallel-no-spinner -- --cov=../jsonargparse --cov-append;
      cd jsonargparse_tests;
      expected=$(tox -l | grep -- -all-extras | sed "s|-.*||" | sort | tr "\n" " ");
      ran=$(ls .coverage.*-all-extras 2>/dev/null | sed "s|^.coverage.||; s|-.*||" | sort | tr "\n" " ");
      coverage combine;
      coverage html;
      coverage report --skip-covered --show-missing;
      if [ "$ran" = "$expected" ] && [ "$(coverage report --format=total)" != 100 ]; then
        echo "$(tput setaf 3) WARNING, coverage is below 100%, see jsonargparse_tests/htmlcov/index.html $(tput sgr0)";
      fi'
    stages: [pre-push]
    language: system
    pass_filenames: false
    verbose: true
