name: manual

on:
  workflow_dispatch:
    inputs:
      OS:
        description: Operating System
        required: true
        type: choice
        options:
        - windows-latest
        - macos-latest
        - ubuntu-latest

permissions:
  contents: read

env:
  # Only resolve distributions published at least one week ago, reducing the
  # chance of installing packages affected by undetected supply chain attacks
  UV_EXCLUDE_NEWER: 7 days
  # Make uv pip install into the python provided by setup-python
  UV_SYSTEM_PYTHON: 1

jobs:
  tox-coverage:
    runs-on: ${{ inputs.OS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          cache-suffix: tox-coverage
          cache-dependency-glob: pyproject.toml
      - run: uv pip install -e ".[dev]"
      - run: tox -- --cov=../jsonargparse --cov-append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage
          path: jsonargparse_tests/.coverage
          include-hidden-files: true
          if-no-files-found: error
